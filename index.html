<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>OriTV</title>
<link rel="stylesheet" href="style.css?v=13">
<link rel="stylesheet" href="tv.css?v=13">
<link rel="stylesheet" href="upgrade.css?v=1">
<link rel="stylesheet" href="status.css?v=1">
</head>
<body>
<div id="app">
<header class="topbar">
<button class="brand focusable" data-action="home"><span class="brand-mark">O</span><span class="brand-name">OriTV</span></button>
<nav class="nav-pill" id="main-nav">
<button class="nav-item focusable active" data-action="home">Главная</button>
<button class="nav-item focusable" data-action="history">История</button>
<button class="nav-item focusable" data-action="movies">Фильмы</button>
<button class="nav-item focusable" data-action="series">Сериалы</button>
<button class="nav-item focusable" data-action="cartoons">Мультфильмы</button>
<button class="nav-item focusable" data-action="anime">Аниме</button>
<button class="nav-item focusable" data-action="favorites">Избранное</button>
<button class="nav-item focusable" data-action="settings">Настройки</button>
</nav>
<div class="head-actions"><button class="icon-btn focusable" data-action="search" aria-label="Поиск">⌕</button></div>
</header>
<main id="view" class="view"></main>
<section id="detail" class="overlay hidden" aria-modal="true"><div class="detail-backdrop"></div><div class="detail-shade"></div><div class="detail-content"><button class="back-btn focusable" data-action="close-detail">‹ Назад</button><div id="detail-meta"></div></div></section>
<section id="search" class="overlay hidden" aria-modal="true"><div class="search-box"><button class="back-btn focusable" data-action="close-search">‹ Назад</button><div class="search-title"><span class="eyebrow">ORITV</span><h2>Поиск</h2></div><input id="search-input" class="search-input focusable" type="text" placeholder="Название фильма или сериала" autocomplete="off"><div id="search-results" class="search-results"></div></div></section>
<div id="toast" class="toast"></div>
</div>
<script src="config.js?v=13"></script>
<script src="engine.js?v=1"></script>
<script src="app.js?v=13"></script>
<script src="upgrade.js?v=1"></script>
<script src="status.js?v=1"></script>
</body>
</html>
