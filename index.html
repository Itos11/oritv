<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>OriTV</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="topbar"><button class="brand focusable" data-action="home"><span class="brand-mark">O</span><span>OriTV</span></button><nav class="nav-pill"><button class="nav-item focusable active" data-action="home">Главная</button><button class="nav-item focusable" data-action="movies">Фильмы</button><button class="nav-item focusable" data-action="series">Сериалы</button><button class="nav-item focusable" data-action="swipe">Свайп</button><button class="nav-item focusable" data-action="settings">Настройки</button></nav><div class="head-actions"><button class="icon-btn focusable" data-action="search">⌕</button><button class="icon-btn focusable" data-action="fullscreen">⛶</button></div></header><main id="view" class="view"></main><div id="detail" class="overlay hidden"><div class="detail-backdrop"></div><div class="detail-shade"></div><div class="detail-content"><button class="back-btn focusable" data-action="close-detail">‹ Назад</button><div id="detail-meta"></div></div></div><div id="search" class="overlay hidden"><div class="search-box"><button class="back-btn focusable" data-action="close-search">‹ Назад</button><div class="search-title"><span class="eyebrow">ORITV</span><h2>Поиск</h2></div><input id="search-input" class="search-input" type="text" placeholder="Название фильма или сериала" autocomplete="off"><div id="search-results" class="search-results"></div></div></div><div id="toast" class="toast"></div></div><script src="config.js"></script><script src="app.js"></script></body></html>
