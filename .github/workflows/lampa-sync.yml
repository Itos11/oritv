name: Sync Lampa Core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'vendor/lampa/**'
      - '.github/workflows/lampa-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Lampa web core
        run: |
          mkdir -p vendor/lampa
          curl -L --fail --retry 3 https://raw.githubusercontent.com/yumata/lampa/main/app.min.js -o vendor/lampa/app.min.js
          curl -L --fail --retry 3 https://raw.githubusercontent.com/yumata/lampa/main/LICENSE -o vendor/lampa/LICENSE
          printf '%s\n' 'Official Lampa core mirror used as an optional engine layer. OriTV UI remains independent.' > vendor/lampa/README.txt
      - name: Commit core
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/lampa
          git diff --cached --quiet || git commit -m 'Sync official Lampa core'
          git push